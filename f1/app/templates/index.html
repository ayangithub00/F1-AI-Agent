<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("{{ url_for('static', path='ferrari-sf-24.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.82);
            z-index: 1;
        }

        .header, .chat-area, .quick-btns, .input-area {
            position: relative;
            z-index: 2;
        }

        .header {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 3px solid #e10600;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 200px; height: 100%;
            background-image: repeating-conic-gradient(#222 0% 25%, transparent 0% 50%);
            background-size: 16px 16px;
            opacity: 0.4;
            mask-image: linear-gradient(to left, rgba(0,0,0,0.9), transparent);
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0.9), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 span { color: #e10600; }
        .flag-icon { font-size: 22px; }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: transparent;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .empty-state h2 {
            font-size: 26px;
            color: #e10600;
            letter-spacing: 1px;
        }

        .empty-state p { font-size: 13px; color: #888; }

        .message {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.65;
        }

        .message.user {
            background: #e10600;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 18px rgba(225, 6, 0, 0.4);
        }

        .message.bot {
            background: rgba(20, 20, 20, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ddd;
            align-self: flex-start;
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 5px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
        }

        .message.thinking {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(8px);
            color: #555;
            align-self: flex-start;
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 5px;
            font-style: italic;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dots span {
            display: inline-block;
            width: 5px; height: 5px;
            background: #e10600;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        .quick-btns {
            padding: 10px 24px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: transparent;
        }

        .quick-btn {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: #bbb;
            font-size: 12px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-btn:hover {
            background: rgba(40, 40, 40, 0.9);
            border-color: #e10600;
            color: #fff;
        }

        .quick-btn .q-icon { color: #e10600; font-size: 13px; }

        .input-area {
            padding: 14px 24px 16px;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #question {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 11px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: border-color 0.15s;
        }

        #question::placeholder { color: #3a3a3a; }
        #question:focus { border-color: #e10600; }

        .send-btn {
            background: #e10600;
            border: none;
            border-radius: 50%;
            width: 42px; height: 42px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s, transform 0.1s;
            flex-shrink: 0;
        }

        .send-btn:hover { opacity: 0.88; }
        .send-btn:active { transform: scale(0.93); }

        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="flag-icon">🏁</span>
            <h1>F1 <span>AI</span> Agent</h1>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">
            <span style="font-size: 36px;">🏎️</span>
            <h2>F1 AI Agent</h2>
            <p>Ask me anything about Formula 1</p>
        </div>
    </div>

    <div class="quick-btns" id="quickBtns">
        <button class="quick-btn" onclick="askQuick('What are the latest F1 race results?')">
            <span class="q-icon">🏆</span> Latest Results
        </button>
        <button class="quick-btn" onclick="askQuick('When and where is the next F1 race?')">
            <span class="q-icon">📅</span> Next Race
        </button>
        <button class="quick-btn" onclick="askQuick('Show me the current F1 drivers standings')">
            <span class="q-icon">📊</span> Standings
        </button>
        <button class="quick-btn" onclick="askQuick('Who are the fastest drivers in F1 right now?')">
            <span class="q-icon">⚡</span> Fastest Drivers
        </button>
    </div>

    <div class="input-area">
        <input type="text" id="question" placeholder="Ask about F1 drivers, races, standings..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" aria-label="Send">&#9658;</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const emptyState = document.getElementById('emptyState');
        const questionEl = document.getElementById('question');
        const sendBtn = document.getElementById('sendBtn');

        questionEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') sendBtn.click();
        });

        function addMessage(text, role) {
            emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function addThinking() {
            emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'message thinking';
            div.innerHTML = 'Searching <div class="dots"><span></span><span></span><span></span></div>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        async function sendQuestion(q) {
            if (!q) return;
            questionEl.value = '';
            addMessage(q, 'user');
            const thinking = addThinking();

            questionEl.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await response.json();
                thinking.remove();
                if (!response.ok) {
                    addMessage(data.detail || 'Something went wrong. Please try again.', 'bot');
                } else {
                    addMessage(data.answer || 'No response received.', 'bot');
                }
            } catch (err) {
                thinking.remove();
                addMessage('Error connecting to server.', 'bot');
            } finally {
                questionEl.disabled = false;
                sendBtn.disabled = false;
                questionEl.focus();
            }
        }

        function askQuick(q) { sendQuestion(q); }

        sendBtn.addEventListener('click', () => sendQuestion(questionEl.value.trim()));
    </script>

</body>
</html>
